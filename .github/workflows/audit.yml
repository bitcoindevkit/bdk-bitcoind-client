name: Security Audit

on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo-recent.lock'
      - '**/Cargo-minimal.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo-recent.lock'
      - '**/Cargo-minimal.lock'
  schedule:
    - cron: '0 0 * * 0' # Sunday @ 00:00:00 UTC
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
permissions: {}

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and configure cache
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: true

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit --deny warnings

      - name: Upload SARIF to GitHub Security tab
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
